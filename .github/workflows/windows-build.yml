name: Build Windows Zip

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e . pyinstaller

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test Outlook import and milestones
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests\outlook_extract.test.cjs tests\outlook_background.test.cjs tests\mail_providers.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate examples
        run: |
          .\.venv\Scripts\python.exe src\daily_task\app.py --data daily_tasks.example.json --check

      - name: Build zip
        run: |
          .\scripts\build_windows.ps1 -Version "0.2.0-beta"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          .\scripts\build_installer.ps1 -Version "0.2.0-beta" -VersionInfo "0.2.0.0" -SkipAppBuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskTask-0.2.0-beta-win64
          path: |
            release\DeskTask-0.2.0-beta-win64.zip
            release\DeskTaskSetup-0.2.0-beta.exe
